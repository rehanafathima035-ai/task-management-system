<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up - TaskMaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .btn-custom {
            background-color: #667eea;
            color: white;
            border-radius: 50px;
            font-weight: bold;
        }

        .btn-custom:hover {
            background-color: #764ba2;
            color: white;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-5 text-center">
                    <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                    <h3 class="fw-bold mb-4">Create an Account</h3>
                    <form action="/signup" method="POST">
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">Username</label>
                            <input type="text" name="username" class="form-control rounded-pill px-3" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" name="password" class="form-control rounded-pill px-3" required>
                        </div>
                        <button type="submit" class="btn btn-custom w-100 py-2 mb-3">Sign Up</button>
                    </form>
                    <p class="text-muted">Already have an account? <a href="/login"
                            class="text-primary fw-bold text-decoration-none">Login</a></p>
                    <a href="/" class="text-muted small text-decoration-none"><i class="fas fa-arrow-left"></i> Back to
                        Home</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
